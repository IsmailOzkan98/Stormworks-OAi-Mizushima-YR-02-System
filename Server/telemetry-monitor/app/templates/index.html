<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PROJECT NAME | TYPE MONITOR</title>

    <!-- Style -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script type="module"src="{{ url_for('static', filename='js/core/themeManager.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='modularStylesheet/structure.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='modularStylesheet/responsive.css') }}">


    <script type="module" src="{{ url_for('static', filename='js/script.js') }}"></script>
</head>

<body>
    <div class="container">

        <header>
            <div class="brand">
                <div class="eyebrow">PROJECT CATEGORY</div>
                <h1>PROJECT NAME <span>PROJECT-IDPROJECT-ID</span></h1>
                <div class="subtitle">PROJECT DESCRIPTION</div>
            </div>

            <!-- THEME SELECTOR -->
            <button
                type="button"
                id="theme-selector-trigger"
                aria-label="Select dashboard theme"
            >
                ◈ THEMES
            </button>

            <div class="header-right">
                <div class="unit-designation">
                    <span>UNIT DESIGNATION</span>
                    <strong>UNIT NAME / CLASS</strong>
                    <small>UNIT DESCRIPTION</small>
                </div>

                <div class="connection">
                    <div class="light" id="onlineLight"></div>
                    <div>
                        <strong id="onlineText">OFFLINE</strong>
                        <small id="connectionDetail">Waiting for telemetry...</small>
                    </div>
                </div>
            </div>
        </header>


        <section class="mission-layout">

            <!-- MISSION BAR MODULE -->
            <div id="missionBarContainer"></div>

            <!-- FLIGHT RECORDER MODULE -->
            <div id="flightRecorderContainer"></div>

        </section>


        <!-- DASHBOARD -->

        <main id="dashboardGrid" class="dashboard-grid"></main>

        <!-- FOOTER -->

        <footer class="footer">
            <span>ORGANIZATION</span>
            <span>PROJECT IDENTIFICATION</span>
            <span>DATA ACCESS</span>
        </footer>


</body>

</html>
